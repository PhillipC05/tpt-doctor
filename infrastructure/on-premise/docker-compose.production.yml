# ============================================================================
# TPT Doctor — Production Docker Compose Stack (On-Premise)
# For self-hosted deployments with full HIPAA controls
# ============================================================================

version: "3.9"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  database:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  jitsi-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  backup-data:
    driver: local
  nginx-logs:
    driver: local

services:
  # ============================================================================
  # Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: tpt-doctor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
      - web
      - patient-portal
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # API Server
  # ============================================================================
  api:
    image: tpt-doctor/api:latest
    container_name: tpt-doctor-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${MINIO_SECRET_KEY}
      STORAGE_BUCKET: tpt-documents
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      ENCRYPTION_PROVIDER: local
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      LOG_LEVEL: info
      PROMETHEUS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - database
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Web Frontend (Staff)
  # ============================================================================
  web:
    image: tpt-doctor/web:latest
    container_name: tpt-doctor-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      VITE_API_URL: https://api.tptdoctor.com
      VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      VITE_AUTH0_CLIENT_ID: ${AUTH0_WEB_CLIENT_ID}
      VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    networks:
      - frontend
      - backend

  # ============================================================================
  # Patient Portal
  # ============================================================================
  patient-portal:
    image: tpt-doctor/patient-portal:latest
    container_name: tpt-doctor-portal
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      VITE_API_URL: https://api.tptdoctor.com
      VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      VITE_AUTH0_CLIENT_ID: ${AUTH0_PORTAL_CLIENT_ID}
      VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    networks:
      - frontend
      - backend

  # ============================================================================
  # Backup Service (pgBackRest-style automated backups)
  # ============================================================================
  backup:
    image: postgres:16-alpine
    container_name: tpt-doctor-backup
    restart: unless-stopped
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/restore.sh:/usr/local/bin/restore.sh:ro
      - backup-data:/backups
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER:-tpt_admin}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: tpt_doctor
      BACKUP_DIR: /backups
      RETENTION_DAYS: 30
      ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      STORAGE_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      STORAGE_BUCKET: tpt-backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - backend
    command: >
      sh -c "
        apk add --no-cache postgresql-client openssl bash coreutils curl &&
        chmod +x /usr/local/bin/backup.sh /usr/local/bin/restore.sh &&
        echo '0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup-cron.log 2>&1' > /etc/crontabs/root &&
        echo '0 14 * * * /usr/local/bin/backup.sh >> /var/log/backup-cron.log 2>&1' >> /etc/crontabs/root &&
        /usr/local/bin/backup.sh &&
        crond -f
      "
    healthcheck:
      test: ["CMD", "test", "-f", "/backups/backup_*.log"]
      interval: 1h
      timeout: 30s
      retries: 1
      start_period: 5m

  # ============================================================================
  # PostgreSQL (Encrypted Volume)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: tpt-doctor-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tpt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tpt_doctor
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tpt_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: tpt-doctor-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MinIO (S3-Compatible Storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: tpt-doctor-minio
    restart: unless-stopped
    expose:
      - "9000"
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Jitsi Meet (Telemedicine)
  # ============================================================================
  jitsi-web:
    image: jitsi/web:latest
    container_name: tpt-doctor-jitsi
    restart: unless-stopped
    expose:
      - "443"
    volumes:
      - jitsi-config:/config
    environment:
      ENABLE_AUTH: 1
      ENABLE_GUESTS: 1
      JICOFO_AUTH_PASSWORD: ${JITSI_PASSWORD}
      JVB_AUTH_PASSWORD: ${JITSI_PASSWORD}
      JVB_STUN_SERVERS: stun.l.google.com:19302,stun1.l.google.com:19302
      XMPP_DOMAIN: meet.tptdoctor.com
      JVB_BREWERY_MUC: jvbbrewery
    depends_on:
      - jitsi-prosody
      - jitsi-jvb
    networks:
      - frontend
      - backend

  jitsi-prosody:
    image: jitsi/prosody:latest
    restart: unless-stopped
    expose:
      - "5222"
      - "5347"
    volumes:
      - jitsi-config:/config
    environment:
      XMPP_DOMAIN: meet.tptdoctor.com
      JICOFO_AUTH_PASSWORD: ${JITSI_PASSWORD}
      JVB_AUTH_PASSWORD: ${JITSI_PASSWORD}
    networks:
      - backend

  jitsi-jvb:
    image: jitsi/jvb:latest
    restart: unless-stopped
    expose:
      - "10000/udp"
    volumes:
      - jitsi-config:/config
    environment:
      XMPP_DOMAIN: meet.tptdoctor.com
      JVB_AUTH_PASSWORD: ${JITSI_PASSWORD}
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
    networks:
      - backend

  # ============================================================================
  # Monitoring Stack
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.48
    container_name: tpt-doctor-prometheus
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.2-enterprise
    container_name: tpt-doctor-grafana
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.6
    container_name: tpt-doctor-node-exporter
    restart: unless-stopped
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - monitoring
</write_to_file>
# ============================================================================
# TPT Doctor — Security Scanning Pipeline
# ============================================================================
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6 AM

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: npm audit
        run: pnpm run audit
        continue-on-error: true

      - name: Run security tests
        run: pnpm run test:security
        continue-on-error: true

      - name: Run penetration tests
        run: pnpm --filter @tpt-doctor/api run test:penetration
        continue-on-error: true
# ============================================================================
# TPT Doctor — Security CI/CD Pipeline (Phase 15.4)
# Runs on every push to main/develop and on all PRs targeting those branches.
# Stages: SAST → Dependency Scanning → Container Scanning → Security Tests
# ============================================================================

name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly dependency + container scan at 02:00 UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ==========================================================================
  # 1. SAST — Static Application Security Testing (Semgrep)
  # ==========================================================================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/jwt
            p/sql-injection
            p/xss
          auditOn: push
          generateSarif: '1'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ==========================================================================
  # 2. Dependency Scanning (Snyk)
  # ==========================================================================
  dependency-scan:
    name: Dependency Scan (Snyk)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk dependency vulnerability scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --sarif-file-output=snyk-deps.sarif
            --all-projects

      - name: Upload Snyk SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dependencies

      - name: Snyk license compliance check
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects --fail-on=upgradable

  # ==========================================================================
  # 3. npm audit (built-in, no token required)
  # ==========================================================================
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (fail on high/critical)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Generate audit report
        run: pnpm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  # ==========================================================================
  # 4. Container Image Scanning (Snyk Container + Trivy)
  # ==========================================================================
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t tpt-doctor-api:${{ github.sha }} \
            .

      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tpt-doctor-api:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container

      - name: Run Snyk container scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: tpt-doctor-api:${{ github.sha }}
          args: --severity-threshold=high --file=apps/api/Dockerfile

  # ==========================================================================
  # 5. CodeQL Analysis
  # ==========================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ==========================================================================
  # 6. Security-focused Unit & Integration Tests
  # ==========================================================================
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tpt_doctor_test
          POSTGRES_USER: tpt_user
          POSTGRES_PASSWORD: tpt_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tpt-doctor/database exec prisma generate
        env:
          DATABASE_URL: postgresql://tpt_user:tpt_pass@localhost:5432/tpt_doctor_test

      - name: Run Prisma migrations
        run: pnpm --filter @tpt-doctor/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://tpt_user:tpt_pass@localhost:5432/tpt_doctor_test

      - name: Run security tests
        run: pnpm --filter @tpt-doctor/api exec jest --testPathPattern="security|penetration|hipaa|country-profiles" --forceExit --passWithNoTests
        env:
          DATABASE_URL: postgresql://tpt_user:tpt_pass@localhost:5432/tpt_doctor_test
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          NODE_ENV: test

      - name: Run HIPAA validation tests
        run: pnpm --filter @tpt-doctor/api exec jest --testPathPattern="hipaa" --forceExit --passWithNoTests
        env:
          DATABASE_URL: postgresql://tpt_user:tpt_pass@localhost:5432/tpt_doctor_test
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          NODE_ENV: test

  # ==========================================================================
  # 7. Secret Detection (Gitleaks)
  # ==========================================================================
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ==========================================================================
  # 8. Security Gate — blocks merge if critical issues found
  # ==========================================================================
  security-gate:
    name: Security Gate
    needs: [sast, dependency-scan, npm-audit, codeql, security-tests, secret-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check security job results
        run: |
          echo "SAST: ${{ needs.sast.result }}"
          echo "Dependency scan: ${{ needs.dependency-scan.result }}"
          echo "npm audit: ${{ needs.npm-audit.result }}"
          echo "CodeQL: ${{ needs.codeql.result }}"
          echo "Security tests: ${{ needs.security-tests.result }}"
          echo "Secret scan: ${{ needs.secret-scan.result }}"

          # Block merge if security tests failed or secrets detected
          if [[ "${{ needs.security-tests.result }}" == "failure" ]]; then
            echo "::error::Security tests failed — merge blocked"
            exit 1
          fi
          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "::error::Secrets detected in code — merge blocked"
            exit 1
          fi
          echo "Security gate passed"

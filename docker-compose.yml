version: "3.9"

# ============================================================================
# TPT Doctor — Development Environment
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: tpt-doctor-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpt_doctor
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tpt-doctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tpt-doctor-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: localhost
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment for local telemedicine
  # jitsi:
  #   image: jitsi/web:latest
  #   container_name: tpt-doctor-jitsi
  #   ports:
  #     - "8443:443"
  #   volumes:
  #     - jitsi-config:/config
  #   environment:
  #     JICOFO_AUTH_PASSWORD: jitsi
  #     JVB_AUTH_PASSWORD: jitsi
  #     JVB_STUN_SERVERS: stun.l.google.com:19302,stun1.l.google.com:19302

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  # jitsi-config:
  #   driver: local